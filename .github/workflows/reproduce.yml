# "Run workflow" button: rebuild the tools, run the tests, download the archived intermediate outputs and recompute
# every statistic, table and figure; the results are attached to the run as a downloadable artifact
name: reproduce
on: workflow_dispatch
jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libhdf5-dev librsvg2-bin fonts-liberation
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: make test
      - run: make figures
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: loyscope-results
          path: |
            results/figures
            results/tables
