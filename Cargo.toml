[package]
name = "loyscope"
version = "0.1.0"
edition = "2021"
[dependencies]
hdf5 = { package = "hdf5-metno", version = "0.10" }
rayon = "1.10"
anyhow = "1"
flate2 = "1"
hdf5-sys = { package = "hdf5-metno-sys", version = "0.10" }
libdeflater = "1"
rand = "0.8"
rand_xoshiro = "0.6"
rand_distr = "0.4"
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
